name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Finds the Gradle project wherever it sits in the repo
      - name: Find the Gradle project
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path "*/build/*" -not -path "./.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts not found"; find . -maxdepth 3 -not -path "./.git/*"; exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Gradle project: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unit tests (parser)
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug and release APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: QuickMath-APKs
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
